name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 仓库不是 pip 包（分发物 = plugin/ 目录）；开发依赖直装
      - name: Install dev dependencies
        run: pip install pytest pytest-asyncio ruff mypy types-PyYAML PyYAML lark-oapi

      - name: Run ruff
        run: python -m ruff check plugin tests

      - name: Run mypy
        run: python -m mypy

      - name: Cache pinned Hermes sources
        uses: actions/cache@v4
        with:
          path: tests/samples
          key: hermes-samples-${{ hashFiles('tests/hermes_sources.json') }}

      - name: Run tests
        run: python -m pytest tests/ -v
