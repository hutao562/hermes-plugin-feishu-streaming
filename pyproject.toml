# 本仓库不再是一个可 pip 安装的包：分发物 = plugin/ 目录（hermes platform 插件，
# 自包含）+ plugin/doctor.py 自检脚本。注入模式的 pip 包形态已在 v0.14.0 归档
# （git tag: archive/injection-mode）。本文件只承载工具链配置。
# （历史 pip 元数据见归档 tag 的 pyproject.toml）

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["tests/samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003: 中文全角标点（，、（）等）在 string / docstring / comment 中会被误判为 ambiguous unicode
ignore = ["RUF001", "RUF002", "RUF003", "RUF006"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
  "e2e: end-to-end tests requiring real Hermes + Feishu (deselected by default)",
]
addopts = "-m 'not e2e'"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["plugin"]

[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Hermes runtime modules (tools.*, plugins.*, gateway.*) are not on the static
# analysis path — they live in the hermes install, imported only at runtime.
module = ["tools.*", "plugins.*", "gateway.*", "hermes_cli.*", "hermes_constants"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# doctor.py 以脚本直跑（python3 plugin/doctor.py）也以 plugin.doctor 导入，
# 顶部的双形态 import 由 except 分支覆盖
module = "plugin.doctor"
disable_error_code = ["import-not-found"]
